[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfemp-reproduction"
version = "0.3.0"
description = "Taichi 3D CFEMP plate-impact benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2",
  "matplotlib>=3.7",
  "taichi==1.7.4",
]

[project.scripts]
cfemp-plate-impact = "cfemp.benchmark:main"
cfemp-plate-impact-3d = "cfemp.benchmark_3d:main"
cfemp-plate-impact-3d-animation = "cfemp.animate_impact_3d:main"
mpm-fem-penalty = "mpm_fem.main:main"

[tool.setuptools.packages.find]
include = ["cfemp*", "mpm_fem*"]
